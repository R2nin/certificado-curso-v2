name: Testes

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compilar contrato
        run: SOLC_LOCAL=1 npx hardhat compile

      - name: Rodar testes + relatório de gas
        run: SOLC_LOCAL=1 npx hardhat test
